name: nestjs-idempotent-orders

services:
  postgres:
    image: postgres:17-alpine
    container_name: idempotent-orders-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: orders
    ports:
      - "5433:5432" # host 5433, so it never clashes with another local Postgres on 5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orders"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
